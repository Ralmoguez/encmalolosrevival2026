
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>REVIVAL // 2026 Q&A</title>

  <style>
    
    :root {
      --bg: #050505;
      --text: #fff7e8;
      --muted: #aaa197;
      --line: rgba(255,255,255,.14);
      --gold: #e8c15a;
      --green: #81e6a6;
      --red: #ff7b7b;
      --font: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --mono: "IBM Plex Mono", "SFMono-Regular", Consolas, monospace;
    }

    * { box-sizing: border-box; }


    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background:
        radial-gradient(circle at top left, rgba(232,193,90,.18), transparent 34rem),
        radial-gradient(circle at bottom right, rgba(255,255,255,.08), transparent 30rem),
        var(--bg);
      color: var(--text);
      font-family: var(--font);
    }

    button, input, textarea { font: inherit; }

    .page { width: min(560px, 100%); }

    .card {
      border: 1px solid var(--line);
      border-radius: 34px;
      background: linear-gradient(180deg, rgba(255,255,255,.075), rgba(255,255,255,.035));
      box-shadow: 0 28px 90px rgba(0,0,0,.55);
      overflow: hidden;
      position: relative;
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px);
      background-size: 100% 7px;
      opacity: .28;
      pointer-events: none;
    }

    .inner { position: relative; padding: 34px; }

    .topbar {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: center;
      margin-bottom: 32px;
      font-family: var(--mono);
      color: var(--muted);
      font-size: 12px;
      letter-spacing: .13em;
      text-transform: uppercase;
    }

    .mark { color: var(--gold); font-weight: 900; }

    .big-question {
      color: var(--gold);
      font-size: 92px;
      line-height: .8;
      letter-spacing: -.08em;
      font-weight: 950;
      margin-bottom: 22px;
    }

    h1 {
      margin: 0;
      font-size: clamp(38px, 8vw, 64px);
      line-height: .9;
      letter-spacing: -.075em;
      text-transform: uppercase;
    }

    .sub {
      color: var(--muted);
      font-size: 16px;
      line-height: 1.55;
      margin: 18px 0 28px;
    }

    label {
      display: block;
      font-family: var(--mono);
      color: var(--muted);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .13em;
      margin: 18px 0 8px;
    }

    input, textarea {
      width: 100%;
      border: 1px solid rgba(255,255,255,.16);
      background: rgba(255,255,255,.065);
      color: var(--text);
      border-radius: 18px;
      padding: 15px 16px;
      outline: none;
    }

    textarea {
      min-height: 210px;
      resize: vertical;
      line-height: 1.45;
    }

    input:focus, textarea:focus {
      border-color: rgba(232,193,90,.8);
      box-shadow: 0 0 0 4px rgba(232,193,90,.12);
    }

    .btn {
      width: 100%;
      border: 0;
      border-radius: 999px;
      background: var(--gold);
      color: #111;
      font-weight: 950;
      text-transform: uppercase;
      letter-spacing: .11em;
      padding: 16px 18px;
      margin-top: 22px;
      cursor: pointer;
    }

    .btn:disabled { opacity: .55; cursor: not-allowed; }

    .note {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
      margin-top: 14px;
    }

    .success, .error {
      display: none;
      margin-top: 18px;
      border-radius: 20px;
      padding: 16px;
      line-height: 1.45;
      font-size: 14px;
    }

    .success {
      border: 1px solid rgba(129,230,166,.35);
      background: rgba(129,230,166,.12);
      color: #dfffe9;
    }

    .error {
      border: 1px solid rgba(255,123,123,.35);
      background: rgba(255,123,123,.12);
      color: #ffd7d7;
    }

    .counter {
      margin-top: 8px;
      text-align: right;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 12px;
    }

    @media (max-width: 520px) {
      body { padding: 14px; }
      .inner { padding: 26px 20px; }
      .big-question { font-size: 74px; }
    }
  </style>
</head>

<body>
  <main class="page">
    <section class="card">
      <div class="inner">
        <div class="topbar">
          <span>REVIVAL // 2026</span>
          <span class="mark">Q&A</span>
        </div>

        <div class="big-question">?</div>
        <h1>Ask a question.</h1>
        <p class="sub">
          Submit a question for the Q&A session. The team may choose questions to be answered live.
        </p>

        <form id="qnaForm">
          <label for="name">Your name</label>
          <input id="name" name="name" placeholder="Optional" autocomplete="name" />

          <label for="question">Your question</label>
          <textarea id="question" name="question" maxlength="280" placeholder="Type your question here..." required></textarea>
          <div class="counter"><span id="count">0</span>/280</div>

          <button class="btn" id="submitBtn" type="submit">Submit question</button>

          <p class="note">Questions are reviewed before appearing on screen.</p>

          <div class="success" id="successBox">Question submitted. Thank you for asking.</div>
          <div class="error" id="errorBox">Something went wrong. Please try again.</div>
        </form>
      </div>
    </section>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
    import {
      getFirestore,
      collection,
      addDoc,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

    // IMPORTANT: Replace this with the same firebaseConfig from your existing website.
    const firebaseConfig = {
      apiKey: "AIzaSyAaxjL-NuYE1VeAoYb1_pWHAE3C4VdCBBY",
      authDomain: "enc-malolos-revival-2026.firebaseapp.com",
      projectId: "enc-malolos-revival-2026",
      storageBucket: "enc-malolos-revival-2026.firebasestorage.app",
      messagingSenderId: "893658387609",
      appId: "1:893658387609:web:f15e870fb82b729e759408",
      measurementId: "G-4VH26Y026V"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const form = document.getElementById("qnaForm");
    const questionEl = document.getElementById("question");
    const countEl = document.getElementById("count");
    const successBox = document.getElementById("successBox");
    const errorBox = document.getElementById("errorBox");
    const submitBtn = document.getElementById("submitBtn");

    questionEl.addEventListener("input", () => {
      countEl.textContent = questionEl.value.length;
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      successBox.style.display = "none";
      errorBox.style.display = "none";

      const question = questionEl.value.trim();

      if (!question) {
        errorBox.textContent = "Please type your question first.";
        errorBox.style.display = "block";
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = "Submitting...";

      try {
        await addDoc(collection(db, "qnaQuestions"), {
          name: document.getElementById("name").value.trim() || "Anonymous",
          question,
          status: "pending",
          createdAt: serverTimestamp(),
          liveAt: null
        });

        form.reset();
        countEl.textContent = "0";
        successBox.textContent = "Question submitted. Thank you for asking.";
        successBox.style.display = "block";
      } catch (error) {
        console.error(error);
        errorBox.textContent = error.message || "Something went wrong. Please try again.";
        errorBox.style.display = "block";
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "Submit question";
      }
    });
  </script>
</body>
</html>
