
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>REVIVAL // 2026 LED</title>

  <style>
    :root {
      --bg: #030303;
      --text: #fff7e8;
      --muted: rgba(255,247,232,.46);
      --line: rgba(255,255,255,.14);
      --gold: #e8c15a;
      --font: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --mono: "IBM Plex Mono", "SFMono-Regular", Consolas, monospace;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
    }

    body {
      display: grid;
      place-items: center;
      padding: 4vw;
      background:
        radial-gradient(circle at center, rgba(232,193,90,.16), transparent 42%),
        radial-gradient(circle at top left, rgba(255,255,255,.08), transparent 24rem),
        #030303;
    }

    .led {
      width: 100%;
      height: 100%;
      border: 1px solid var(--line);
      border-radius: 36px;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 6vw;
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(circle at center, rgba(232,193,90,.10), transparent 58%),
        linear-gradient(180deg, #080808, #020202);
      box-shadow: 0 40px 100px rgba(0,0,0,.7);
    }

    .led::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(rgba(255,255,255,.04) 1px, transparent 1px);
      background-size: 100% 9px;
      opacity: .35;
      pointer-events: none;
    }

    .led::after {
      content: "";
      position: absolute;
      inset: -20%;
      background: radial-gradient(circle, transparent 50%, rgba(0,0,0,.62) 100%);
      pointer-events: none;
    }

    .content {
      position: relative;
      z-index: 2;
      max-width: 1500px;
      animation: fadeIn .35s ease both;
    }

    .label {
      color: var(--gold);
      font-family: var(--mono);
      font-size: clamp(18px, 2vw, 34px);
      letter-spacing: .24em;
      text-transform: uppercase;
      margin-bottom: clamp(26px, 4vw, 64px);
    }

    .question {
      font-size: clamp(54px, 8vw, 150px);
      line-height: 1.01;
      letter-spacing: -.08em;
      font-weight: 950;
      text-wrap: balance;
    }

    .empty {
      color: rgba(255,247,232,.38);
      font-size: clamp(38px, 6vw, 96px);
      line-height: 1;
      letter-spacing: -.07em;
      font-weight: 950;
      text-transform: uppercase;
    }

    .hint {
      margin-top: 28px;
      color: var(--muted);
      font-family: var(--mono);
      font-size: clamp(12px, 1vw, 18px);
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    .qr-wrap {
      display: grid;
      justify-items: center;
      gap: clamp(18px, 3vw, 36px);
    }

    .qr-title {
      color: var(--gold);
      font-family: var(--mono);
      font-size: clamp(18px, 2vw, 34px);
      letter-spacing: .24em;
      text-transform: uppercase;
    }

    .qr-heading {
      font-size: clamp(46px, 7vw, 120px);
      line-height: .94;
      letter-spacing: -.08em;
      font-weight: 950;
      text-transform: uppercase;
    }

    .qr-box {
      background: #fff;
      border-radius: clamp(22px, 3vw, 42px);
      padding: clamp(16px, 2vw, 30px);
      box-shadow: 0 30px 80px rgba(0,0,0,.5);
    }

    .qr-box img {
      display: block;
      width: min(34vw, 430px);
      height: min(34vw, 430px);
      min-width: 220px;
      min-height: 220px;
    }

    .qr-url {
      color: var(--muted);
      font-family: var(--mono);
      font-size: clamp(15px, 1.4vw, 24px);
      letter-spacing: .04em;
      word-break: break-all;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px) scale(.99); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
  </style>
</head>

<body>
  <main class="led">
    <section class="content" id="content">
      <div class="empty">Q&A</div>
      <div class="hint">Waiting for selected question</div>
    </section>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
    import {
      getFirestore,
      doc,
      onSnapshot
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

    // IMPORTANT: Replace this with the same firebaseConfig from your existing website.
    const firebaseConfig = {
      apiKey: "AIzaSyAaxjL-NuYE1VeAoYb1_pWHAE3C4VdCBBY",
      authDomain: "enc-malolos-revival-2026.firebaseapp.com",
      projectId: "enc-malolos-revival-2026",
      storageBucket: "enc-malolos-revival-2026.firebasestorage.app",
      messagingSenderId: "893658387609",
      appId: "1:893658387609:web:f15e870fb82b729e759408",
      measurementId: "G-4VH26Y026V"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const QNA_URL = "https://encmalolos-revival2026.web.app/qna";
    const QR_IMAGE_URL = "https://api.qrserver.com/v1/create-qr-code/?size=900x900&margin=24&data=" + encodeURIComponent(QNA_URL);

    const content = document.getElementById("content");
    let lastRenderKey = "";

    onSnapshot(doc(db, "qnaControl", "live"), (docSnap) => {
      if (!docSnap.exists()) {
        showWaitingScreen();
        return;
      }

      const data = docSnap.data() || {};
      const mode = data.mode || "hidden";

      if (mode === "qr") {
        renderQr();
        return;
      }

      if (mode === "question" && data.question) {
        renderQuestion(data);
        return;
      }

      showWaitingScreen();
    }, (error) => {
      console.error(error);
      showWaitingScreen("Connection error");
    });

    function renderQr() {
      const key = "qr";
      if (key === lastRenderKey) return;
      lastRenderKey = key;

      animate();

      content.innerHTML = `
        <div class="qr-wrap">
          <div class="qr-title">Scan to ask</div>
          <div class="qr-heading">Submit your question</div>
          <div class="qr-box">
            <img src="${QR_IMAGE_URL}" alt="QR code to submit a question">
          </div>
          <div class="qr-url">${escapeHtml(QNA_URL)}</div>
        </div>
      `;
    }

    function renderQuestion(data) {
      const key = "question-" + String(data.questionId || data.question || "");

      if (key === lastRenderKey) return;
      lastRenderKey = key;

      animate();

      content.innerHTML = `
        <div class="label">Question</div>
        <div class="question">${escapeHtml(data.question || "")}</div>
      `;
    }

    function showWaitingScreen(message = "Waiting for selected question") {
      const key = "hidden-" + message;
      if (key === lastRenderKey) return;
      lastRenderKey = key;

      animate();

      content.innerHTML = `
        <div class="empty">Q&A</div>
        <div class="hint">${escapeHtml(message)}</div>
      `;
    }

    function animate() {
      content.style.animation = "none";
      void content.offsetWidth;
      content.style.animation = "fadeIn .35s ease both";
    }

    function escapeHtml(value) {
      return String(value || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }
  </script>
</body>
</html>
